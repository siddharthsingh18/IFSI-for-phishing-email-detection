name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install -e .
      - name: Compile sources
        run: python -m compileall -q src tests
      - name: Run unit tests
        run: >-
          python -m pytest
          tests/test_api.py
          tests/test_benchmark_suite.py
          tests/test_build_corpora.py
          tests/test_confounding_audit.py
          tests/test_model_config.py
      - name: Exercise legacy DeepSeek offline dry-run
        run: >-
          phishbench-run
          --input examples/sample_emails.jsonl
          --output /tmp/phishbench-results.jsonl
          --manifest /tmp/phishbench-manifest.json
          --dataset synthetic_demo
          --condition clean
          --method ours
          --model deepseek-v4-pro
          --thinking off
          --limit 1
          --dry-run
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.14.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Lint frontend
        run: npm run lint
      - name: Build frontend
        run: npm run build
