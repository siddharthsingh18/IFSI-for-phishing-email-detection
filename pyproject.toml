[build-system]
requires = ["setuptools==75.8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "phishbench"
version = "0.1.0"
description = "Reproducible evaluation of injection-first staged inference for LLM phishing detection"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  {name = "Zhenwei Zhu"},
  {name = "Jia Liu"},
]
dependencies = [
  "numpy==2.4.6",
  "pytest==8.3.5",
  "scikit-learn==1.9.1",
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Operating System :: OS Independent",
]

[project.scripts]
phishbench-run = "phishbench.runner:main"
phishbench-freeze-prompts = "phishbench.freeze_prompts:main"
phishbench-validate = "phishbench.validate_artifacts:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
